<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="xiabao.png">
<title>校园虾宝 · 群聊 AI Agent</title>
<style>
  :root{
    /* 冷纸 × 墨蓝 × 虾宝背带蓝 */
    --bg:#eff2f8; --card:#fdfeff; --card-2:#f4f7fb;
    --line:#e0e6f0; --line-2:#eaeef6;
    --ink:#171c28; --txt:#333b4d; --sub:#7e8798; --faint:#aab3c2;
    --brand:#2f5bd7; --brand-deep:#1f3f9e; --brand-bg:#eaf0fc; --brand-line:#c9d8f5;
    --green:#2e7d4f; --green-bg:#e7f2ea; --green-line:#c4dfce;
    --amber:#a06b0d; --amber-bg:#faf1dd; --amber-line:#e8d5ae;
    --red:#bf3b2b; --red-bg:#fae9e5; --red-line:#efc5bc;
    --plum:#7d5a78; --plum-bg:#f4ecf2; --plum-line:#e0cadd;
    --code-bg:#1d2436; --code-txt:#b9c8ec;
    --shadow:0 1px 2px rgba(25,35,60,.05),0 10px 32px -12px rgba(25,35,60,.14);
    --serif:"Songti SC","Noto Serif SC","STSong",serif;
    --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:
    radial-gradient(1200px 500px at 85% -10%,#e7eefb 0%,transparent 60%),
    radial-gradient(900px 400px at -10% 110%,#e9ecf4 0%,transparent 55%),
    var(--bg);
    color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased}

  /* ───────── 顶栏 ───────── */
  header{padding:14px 24px 12px;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .logo{height:48px;width:auto;border-radius:12px;flex-shrink:0;object-fit:contain;display:block;filter:drop-shadow(0 4px 8px rgba(47,91,215,.22));transition:transform .2s}
  .logo:hover{transform:rotate(-2deg) scale(1.05)}
  header .ttl{font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);letter-spacing:.5px;line-height:1.2}
  header .ttl small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--sub);letter-spacing:2px;display:block;margin-top:2px}
  .tag{font-size:11.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px;line-height:1;box-shadow:0 1px 2px rgba(25,35,60,.04)}
  .tag b{color:var(--brand);font-weight:600}
  header .spacer{flex:1}
  header button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:10px;padding:8px 16px;cursor:pointer;font-size:13px;transition:all .18s;box-shadow:0 1px 2px rgba(25,35,60,.05)}
  header button:hover{border-color:var(--brand-line);color:var(--brand);background:var(--brand-bg)}

  /* ───────── 三栏布局 ───────── */
  main{flex:1;display:grid;grid-template-columns:1.15fr 1fr .85fr;gap:16px;padding:0 24px 18px;min-height:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:var(--shadow)}
  .panel .hd{padding:14px 18px 12px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:10px;flex-shrink:0}
  .panel .hd .no{font-family:var(--serif);font-size:13px;font-weight:700;color:var(--brand);letter-spacing:1px}
  .panel .hd .tt{font-size:14px;font-weight:650;color:var(--ink);letter-spacing:.3px}
  .panel .hd .hint{font-size:11px;color:var(--faint);margin-left:auto}
  .panel .bd{flex:1;overflow-y:auto;padding:14px;min-height:0}
  .panel .bd::-webkit-scrollbar{width:6px}
  .panel .bd::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

  /* ───────── 群聊 ───────── */
  .group-tabs{display:flex;gap:6px;padding:12px 14px 0;flex-shrink:0}
  .group-tabs .gt{flex:1;text-align:center;padding:8px 4px 9px;font-size:12px;border-radius:10px 10px 0 0;cursor:pointer;color:var(--sub);border:1px solid transparent;border-bottom:none;transition:all .15s;position:relative}
  .group-tabs .gt:hover{color:var(--txt)}
  .group-tabs .gt.on{background:var(--card-2);color:var(--ink);font-weight:650;border-color:var(--line)}
  .group-tabs .gt.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--brand);border-radius:2px}
  .chat{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--card-2)}
  .chat .msgs{flex:1;overflow-y:auto;padding:16px 14px}
  .msg{display:flex;gap:10px;margin-bottom:14px;animation:fadeUp .3s ease both}
  .msg .avatar{width:34px;height:34px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;box-shadow:0 2px 6px -2px rgba(25,35,60,.25)}
  .msg .body{max-width:78%}
  .msg .name{font-size:11px;color:var(--faint);margin-bottom:4px}
  .msg .bubble{background:var(--card);border:1px solid var(--line-2);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:13.5px;line-height:1.6;color:var(--txt);white-space:pre-wrap;word-break:break-all;box-shadow:0 1px 2px rgba(25,35,60,.04)}
  .msg.agent{flex-direction:row-reverse}
  .msg.agent .bubble{background:var(--brand-bg);border:1px solid var(--brand-line);border-radius:14px 4px 14px 14px;color:var(--brand-deep)}
  .msg.agent .avatar{background:var(--brand-bg)!important;border:1px solid var(--brand-line);padding:2px}
  .msg.agent .avatar img{width:100%;height:100%;object-fit:contain;display:block;border-radius:9px}
  .msg.agent .name{text-align:right}
  .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--card);flex-shrink:0}
  .composer input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:13px;outline:none;background:var(--card-2);transition:all .18s}
  .composer input:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px var(--brand-bg)}
  .composer button{background:linear-gradient(160deg,#4a7de3,#2b55c9);color:#fff;border:none;border-radius:11px;padding:0 20px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px -4px rgba(43,85,201,.5);transition:all .18s}
  .composer button:hover{transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(43,85,201,.6)}
  .composer button:active{transform:translateY(0)}
  .quick{padding:10px 12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;background:var(--card);flex-shrink:0}
  .quick button{font-size:11px;border:1px solid var(--line);background:var(--card-2);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--sub);transition:all .15s}
  .quick button:hover{color:var(--brand);border-color:var(--brand-line);background:var(--brand-bg)}

  /* ───────── Agent 决策流 ───────── */
  .feed-item{border-left:2px solid var(--line);padding:0 0 16px 14px;margin-left:8px;position:relative;animation:fadeUp .3s ease both}
  .feed-item:last-child{padding-bottom:2px}
  .feed-item::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2.5px solid var(--faint);box-shadow:0 0 0 3px var(--card)}
  .feed-item .ph{font-size:10.5px;font-weight:650;padding:2px 9px;border-radius:5px;display:inline-block;margin-bottom:5px;letter-spacing:.5px}
  .feed-item .t{font-size:12.5px;font-weight:650;color:var(--ink);margin:2px 0}
  .feed-item .d{font-size:12px;color:var(--sub);line-height:1.6;word-break:break-all}
  .ph.listen{background:var(--brand-bg);color:var(--brand)} .ph.extract{background:var(--plum-bg);color:var(--plum)}
  .ph.decide{background:var(--amber-bg);color:var(--amber)} .ph.tool{background:var(--green-bg);color:var(--green)}
  .ph.human{background:var(--red-bg);color:var(--red)} .ph.dedup{background:var(--green-bg);color:var(--green)}
  .ph.skip,.ph.system{background:var(--card-2);color:var(--faint)}
  .feed-item.listen::before{border-color:var(--brand)} .feed-item.extract::before{border-color:var(--plum)}
  .feed-item.decide::before{border-color:var(--amber)} .feed-item.tool::before{border-color:var(--green)}
  .feed-item.human::before{border-color:var(--red)} .feed-item.dedup::before{border-color:var(--green)}
  .feed-item.skip::before,.feed-item.system::before{border-color:var(--faint)}

  /* ───────── 任务卡片 ───────── */
  .task{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px;background:var(--card);animation:fadeUp .35s ease both;transition:all .2s}
  .task:hover{border-color:var(--brand-line)}
  .task.risk-high{border-color:var(--red-line);background:linear-gradient(180deg,#fffaf8,var(--card));box-shadow:0 6px 20px -10px rgba(191,59,43,.25)}
  .task.risk-medium{border-color:var(--amber-line)}
  .task .tt{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .task .ts{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:9px}
  .task .raws{border:1px solid var(--line-2);border-left:3px solid var(--brand-line);border-radius:8px;background:var(--card-2);padding:8px 10px;margin-bottom:9px}
  .task .raws .rh{font-size:10px;color:var(--brand);font-weight:650;margin-bottom:5px;letter-spacing:.5px}
  .task .raw{font-size:11.5px;color:var(--txt);line-height:1.6;padding:4px 0;border-bottom:1px dashed var(--line-2)}
  .task .raw:last-child{border-bottom:none}
  .task .raw .rg{color:var(--brand);margin-right:4px;white-space:nowrap;font-weight:600}
  .task .meta{display:flex;gap:6px;margin-bottom:10px}
  .pill{font-size:10px;font-weight:600;padding:3px 10px;border-radius:999px;letter-spacing:.3px}
  .pill.add{background:var(--brand-bg);color:var(--brand);border:1px solid var(--brand-line)} .pill.update{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
  .pill.conflict{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)} .pill.risk{background:var(--card-2);color:var(--sub);border:1px solid var(--line)}
  .task .acts{display:flex;gap:8px}
  .task .acts button{flex:1;border:none;border-radius:9px;padding:8px;font-size:12.5px;font-weight:650;cursor:pointer;transition:all .15s}
  .task .ok{background:linear-gradient(160deg,#4a7de3,#2b55c9);color:#fff;box-shadow:0 4px 10px -4px rgba(43,85,201,.5)}
  .task .ok:hover{transform:translateY(-1px)}
  .task .no{background:var(--card);border:1px solid var(--line)!important;color:var(--sub)}
  .task .no:hover{border-color:var(--faint)!important;color:var(--txt)}
  .task.done{opacity:.72}
  .task.done .acts{display:none}
  .task .res{font-size:11.5px;color:var(--green);font-weight:600;margin-top:6px}
  .task .res.rej{color:var(--faint)}
  .tool-pre{font-size:10px;background:var(--code-bg);color:var(--code-txt);border-radius:8px;padding:8px 10px;margin-top:9px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;opacity:.92}
  .tool-pre::before{content:"TOOL_CALL ";color:#7286ad}

  /* ───────── 日历 ───────── */
  .ev{display:flex;gap:11px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:11px 4px;animation:fadeUp .3s ease both}
  .ev:last-child{border:none}
  .ev .dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(150deg,#4a7de3,#2b55c9);margin-top:5px;flex-shrink:0;box-shadow:0 2px 5px -1px rgba(43,85,201,.4)}
  .ev .et{font-size:13px;font-weight:650;color:var(--ink);line-height:1.45}
  .ev .es{font-size:11px;color:var(--sub);margin-top:3px}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:36px 20px;line-height:2}
  .empty .mascot{width:56px;height:auto;margin-bottom:8px;opacity:.7;filter:grayscale(.2)}
  .dl{margin:10px;display:block;text-align:center;background:var(--green-bg);color:var(--green);border:1px solid var(--green-line);border-radius:12px;padding:11px;font-size:12.5px;font-weight:650;text-decoration:none;transition:all .18s;letter-spacing:.3px}
  .dl:hover{transform:translateY(-1px);box-shadow:0 6px 14px -6px rgba(46,125,79,.35)}
  .backend{font-size:11px;color:var(--faint);padding:0 18px 12px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img src="xiabao.png" class="logo" alt="校园虾宝" draggable="false">
  <div class="ttl">校园虾宝<small>CAMPUS XIAOBAO · 群聊 AI AGENT</small></div>
  <span class="tag" id="backendTag">加载中…</span>
  <span class="tag">跨群识别 · 冲突检测 · Tool Calling → 日历</span>
  <div class="spacer"></div>
  <button onclick="reset()">重置演示</button>
</header>
<main>
  <!-- 左：群聊 -->
  <section class="panel">
    <div class="hd"><span class="no">01</span><span class="tt">多群消息流</span><span class="hint">发条通知试试</span></div>
    <div class="chat">
      <div class="group-tabs" id="tabs"></div>
      <div class="msgs" id="msgs"></div>
      <div class="quick" id="quick"></div>
      <div class="composer">
        <input id="input" placeholder="输入群消息，或点击下方快捷演示…" onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">发送</button>
      </div>
    </div>
  </section>
  <!-- 中：Agent 思考 + 任务 -->
  <section class="panel">
    <div class="hd"><span class="no">02</span><span class="tt">Agent 决策流</span><span class="hint">监听 → 识别 → 决策 → 执行</span></div>
    <div class="bd" id="feed"></div>
    <div class="hd" style="border-top:1px solid var(--line)"><span class="no">03</span><span class="tt">待确认任务</span><span class="hint">Human-in-the-loop</span></div>
    <div class="bd" id="tasks" style="max-height:45%"></div>
  </section>
  <!-- 右：日历 -->
  <section class="panel">
    <div class="hd"><span class="no">04</span><span class="tt">我的日历</span><span class="hint">Tool Calling 写入</span></div>
    <div class="bd" id="events"></div>
    <a class="dl" href="/api/calendar.ics" download>⬇︎ 下载 calendar.ics · 可导入手机/系统日历</a>
    <div class="backend" id="backendFoot"></div>
  </section>
</main>

<script>
const state={groups:[],cur:0,chats:{},quickMsgs:{}};
const AV={};
const COLORS=['#44618c','#7a5a8c','#3f7d6d','#8a6a3f','#5a7490','#8c5a5a'];

const DEMO={
  '数据结构课程群':[
    '【助教】各位同学，数据结构期末考试定在6月10日 14:00，地点在紫金港校区东1楼101教室，请相互转告',
    '同学们晚上记得来上课，别迟到啦',
    '【助教】重要通知：数据结构期末考试时间变更为6月12日 14:00，地点不变，请以新时间为准'
  ],
  '机器人社社团群':[
    '【社长】机器人社本学期总结会将于6月11日 14:00在南校区活动中心201举行，全体成员参加',
    '【社长】周五晚上社团聚餐，自愿报名，想去的朋友接龙',
    '【社长】通知：总结会改到下周四下午3点，地点不变，收到请扣1',
    '【社长】重要提醒（转自教务）：数据结构期末考试时间为6月11日 9:00，与此前课程群说的6月10日 14:00不一致，请同学们以教务答复为准'
  ],
  '宿舍群':[
    '兄弟们今晚开黑吗？',
    '【同学】提醒一下，数据结构期末考试6月10日 14:00在东1楼101，大家考试周别忘了复习',
    '明天一起去图书馆占座，谁起得早谁去'
  ]
};

async function api(path,opt){const r=await fetch(path,opt);return r.json()}
async function refresh(){
  const s=await api('/api/state');
  state.groups=s.groups;
  document.getElementById('backendTag').innerHTML='LLM 后端：<b>'+esc(s.llm_backend)+'</b>';
  document.getElementById('backendFoot').textContent='识别引擎：'+s.llm_backend+' · 规则引擎兜底 · 失败自动降级';
  // tabs
  const tabs=document.getElementById('tabs');
  if(!tabs.children.length){
    tabs.innerHTML=s.groups.map((g,i)=>`<div class="gt${i===state.cur?' on':''}" onclick="switchGroup(${i})">${g}</div>`).join('');
  }
  // feed
  document.getElementById('feed').innerHTML=s.feed.map(f=>
    `<div class="feed-item ${f.phase}"><span class="ph ${f.phase}">${phName(f.phase)}</span>
     <div class="t">${f.ts} · ${esc(f.title)}</div><div class="d">${esc(f.detail)}</div></div>`).join('');
  document.getElementById('feed').scrollTop=1e9;
  // tasks
  document.getElementById('tasks').innerHTML=s.tasks.length?s.tasks.map(t=>`
    <div class="task risk-${t.risk} ${t.action!=='pending'?'done':''}">
      <div class="tt">${esc(t.title)}</div><div class="ts">${esc(t.summary)}</div>
      ${(t.detail&&t.detail.raw_messages&&t.detail.raw_messages.length)?`
        <div class="raws"><div class="rh">📋 消息原文 · 已汇总 ${t.detail.raw_messages.length} 条 · 确认后写入日历</div>
        ${t.detail.raw_messages.map(m=>`<div class="raw"><span class="rg">[${esc(m.group)}·${esc(m.sender)}]</span>${esc(m.text)}</div>`).join('')}</div>`:''}
      <div class="meta"><span class="pill ${t.type}">${typeName(t.type)}</span><span class="pill risk">风险：${t.risk==='high'?'高':t.risk==='medium'?'中':'低'}</span></div>
      ${t.action==='pending'?`
        <div class="acts"><button class="ok" onclick="confirm('${t.id}',true)">✓ 确认执行</button>
        <button class="no" onclick="confirm('${t.id}',false)">✗ 忽略</button></div>`
        :`<div class="res ${t.action==='dismissed'?'rej':''}">${t.action==='confirmed'?'✅ '+esc(t.result):'🚫 '+esc(t.result)}</div>`}
      <div class="tool-pre">${esc(JSON.stringify({name:t.tool_call.name,arguments:t.tool_call.arguments},null,0))}</div>
    </div>`).join(''):'<div class="empty"><img src="xiabao.png" class="mascot" alt="虾宝" draggable="false"><br>暂无任务<br>Agent 识别到通知后会生成确认卡片</div>';
  // events
  document.getElementById('events').innerHTML=s.events.length?s.events.map(e=>
    `<div class="ev"><div class="dot"></div><div><div class="et">${esc(e.title)}</div>
     <div class="es">${esc(e.start)}${e.location?' · '+esc(e.location):''}</div></div></div>`).join('')
    :'<div class="empty"><img src="xiabao.png" class="mascot" alt="虾宝" draggable="false"><br>日历为空<br>确认任务后 Agent 会通过 Tool Calling 写入日程</div>';
}
function phName(p){return{listen:'监听',extract:'识别',decide:'决策',tool:'执行',human:'人工确认',dedup:'去重',skip:'过滤',system:'系统'}[p]||p}
function typeName(t){return{add:'新增日程',update:'时间变更',conflict:'跨群冲突',remind:'提醒'}[t]||t}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function switchGroup(i){state.cur=i;document.querySelectorAll('.gt').forEach((el,j)=>el.classList.toggle('on',j===i));renderMsgs();renderQuick()}
function renderMsgs(){
  const g=state.groups[state.cur]||'';
  const list=state.chats[g]||[];
  document.getElementById('msgs').innerHTML=list.map(m=>`
    <div class="msg ${m.agent?'agent':''}">
      <div class="avatar" style="background:${m.color}">${m.agent?'<img src="xiabao.png" alt="虾宝" draggable="false">':esc(m.sender[0])}</div>
      <div class="body"><div class="name">${esc(m.sender)}</div><div class="bubble">${esc(m.text)}</div></div>
    </div>`).join('')||'<div class="empty"><img src="xiabao.png" class="mascot" alt="虾宝" draggable="false"><br>点击下方快捷按钮<br>快速演示完整链路</div>';
  document.getElementById('msgs').scrollTop=1e9;
}
function renderQuick(){
  const g=state.groups[state.cur]||'';
  document.getElementById('quick').innerHTML=(DEMO[g]||[]).map((t,i)=>
    `<button onclick="quick(${i})">演示${i+1} · ${t.slice(0,12)}…</button>`).join('');
}
async function quick(i){document.getElementById('input').value=DEMO[state.groups[state.cur]][i];send()}
async function send(){
  const inp=document.getElementById('input');
  const text=inp.value.trim(); if(!text)return;
  const g=state.groups[state.cur];
  if(!state.chats[g])state.chats[g]=[];
  const sender='我';
  const color=AV[sender]||(AV[sender]=COLORS[Object.keys(AV).length%COLORS.length]);
  state.chats[g].push({sender,text,color});
  inp.value='';renderMsgs();
  const r=await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:g,sender,text})});
  // Agent 回应气泡
  let reply;
  if(!r.recognized)reply='（非通知消息，已过滤，不产生任务）';
  else if(r.dedup)reply=`🔁 检测到跨群重复通知「${r.notice.event}」，已去重，不重复打扰你`;
  else reply=`📋 已识别通知「${r.notice.event}」→ 生成确认卡片，请在右侧确认是否写入日历`;
  state.chats[g].push({sender:'校园虾宝',text:reply,agent:true,color:''});
  renderMsgs();refresh();
}
async function confirm(id,ok){
  await api(`/api/task/${id}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:ok})});
  refresh();
}
async function reset(){await api('/api/reset',{method:'POST'});state.chats={};renderMsgs();refresh()}
refresh();
</script>
