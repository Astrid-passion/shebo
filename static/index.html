<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园虾宝 · 群聊 AI Agent</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e8eaee; --txt:#262b33; --sub:#7b8494;
    --blue:#3b7cff; --blue-bg:#eef3ff; --green:#12b76a; --green-bg:#e8f8f0;
    --orange:#f79009; --orange-bg:#fef4e6; --red:#f04438; --red-bg:#feeceb;
    --purple:#7a5af8; --purple-bg:#f1edff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
  header .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3b7cff,#7a5af8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
  header h1{font-size:17px}
  header .tag{font-size:12px;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:999px}
  header .spacer{flex:1}
  header button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:13px}
  header button:hover{background:var(--bg)}
  main{flex:1;display:grid;grid-template-columns:1.15fr 1fr 0.85fr;gap:14px;padding:14px 20px;min-height:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel .hd{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .panel .bd{flex:1;overflow-y:auto;padding:12px;min-height:0}

  /* 群聊 */
  .group-tabs{display:flex;gap:6px;padding:10px 12px 0;flex-shrink:0}
  .group-tabs .gt{flex:1;text-align:center;padding:7px 4px;font-size:12px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--sub);border:1px solid transparent;border-bottom:none}
  .group-tabs .gt.on{background:#fff;color:var(--blue);font-weight:600;border-color:var(--line)}
  .chat{flex:1;display:flex;flex-direction:column;min-height:0}
  .chat .msgs{flex:1;overflow-y:auto;padding:12px;background:#fff}
  .msg{display:flex;gap:8px;margin-bottom:12px}
  .msg .avatar{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .msg .body{max-width:80%}
  .msg .name{font-size:11px;color:var(--sub);margin-bottom:3px}
  .msg .bubble{background:var(--bg);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-all}
  .msg.agent{flex-direction:row-reverse}
  .msg.agent .bubble{background:var(--blue-bg);border-radius:12px 4px 12px 12px;color:var(--blue)}
  .msg.agent .name{text-align:right}
  .composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff;flex-shrink:0}
  .composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
  .composer input:focus{border-color:var(--blue)}
  .composer button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:13px;cursor:pointer}
  .quick{padding:8px 10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;background:#fafbfc;flex-shrink:0}
  .quick button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--sub)}
  .quick button:hover{color:var(--blue);border-color:var(--blue)}

  /* Agent 思考流 */
  .feed-item{border-left:2px solid var(--line);padding:0 0 14px 12px;margin-left:6px;position:relative}
  .feed-item::before{content:"";position:absolute;left:-5px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .feed-item .ph{font-size:11px;font-weight:600;padding:1px 8px;border-radius:4px;display:inline-block;margin-bottom:4px}
  .feed-item .t{font-size:12px;font-weight:600;margin:2px 0}
  .feed-item .d{font-size:12px;color:var(--sub);line-height:1.5;word-break:break-all}
  .ph.listen{background:var(--blue-bg);color:var(--blue)} .ph.extract{background:var(--purple-bg);color:var(--purple)}
  .ph.decide{background:var(--orange-bg);color:var(--orange)} .ph.tool{background:var(--green-bg);color:var(--green)}
  .ph.human{background:var(--red-bg);color:var(--red)} .ph.dedup{background:var(--green-bg);color:var(--green)}
  .ph.skip,.ph.system{background:var(--bg);color:var(--sub)}
  .feed-item.listen::before{background:var(--blue)} .feed-item.extract::before{background:var(--purple)}
  .feed-item.decide::before{background:var(--orange)} .feed-item.tool::before{background:var(--green)}
  .feed-item.human::before{background:var(--red)}

  /* 任务卡片 */
  .task{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
  .task.risk-high{border-color:#fda29b;background:linear-gradient(180deg,#fff,#fff8f7)}
  .task .tt{font-size:13px;font-weight:600;margin-bottom:4px}
  .task .ts{font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:8px}
  .task .raws{border:1px dashed var(--line);border-radius:8px;background:#fafbfc;padding:6px 8px;margin-bottom:8px}
  .task .raws .rh{font-size:10px;color:var(--sub);margin-bottom:4px}
  .task .raw{font-size:11px;color:var(--txt);line-height:1.5;padding:3px 0;border-bottom:1px dashed #f0f1f4}
  .task .raw:last-child{border-bottom:none}
  .task .raw .rg{color:var(--blue);margin-right:4px;white-space:nowrap}
  .task .meta{display:flex;gap:6px;margin-bottom:8px}
  .pill{font-size:10px;padding:2px 8px;border-radius:999px}
  .pill.add{background:var(--blue-bg);color:var(--blue)} .pill.update{background:var(--orange-bg);color:var(--orange)}
  .pill.conflict{background:var(--red-bg);color:var(--red)} .pill.risk{background:var(--bg);color:var(--sub);border:1px solid var(--line)}
  .task .acts{display:flex;gap:8px}
  .task .acts button{flex:1;border:none;border-radius:8px;padding:7px;font-size:12px;cursor:pointer}
  .task .ok{background:var(--blue);color:#fff} .task .no{background:#fff;border:1px solid var(--line)!important;color:var(--sub)}
  .task.done .acts{display:none}
  .task .res{font-size:11px;color:var(--green);margin-top:6px}
  .task .res.rej{color:var(--sub)}
  .tool-pre{font-size:10px;background:#0f172a;color:#7dd3fc;border-radius:8px;padding:8px;margin-top:8px;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}

  /* 日历事件 */
  .ev{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:10px 2px}
  .ev:last-child{border:none}
  .ev .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px;flex-shrink:0}
  .ev .et{font-size:13px;font-weight:600} .ev .es{font-size:11px;color:var(--sub);margin-top:2px}
  .empty{color:var(--sub);font-size:12px;text-align:center;padding:30px 0}
  .dl{margin:10px;display:block;text-align:center;background:var(--green-bg);color:var(--green);border-radius:10px;padding:10px;font-size:13px;font-weight:600;text-decoration:none}
  .backend{font-size:11px;color:var(--sub);padding:0 16px 10px}
</style>
</head>
<body>
<header>
  <div class="logo">🦐</div>
  <h1>校园虾宝 · 群聊 AI Agent</h1>
  <span class="tag" id="backendTag">加载中…</span>
  <span class="tag">跨群识别 · 冲突检测 · Tool Calling → 日历</span>
  <div class="spacer"></div>
  <button onclick="reset()">重置演示</button>
</header>
<main>
  <!-- 左：群聊 -->
  <section class="panel">
    <div class="hd">💬 多群消息流</div>
    <div class="chat">
      <div class="group-tabs" id="tabs"></div>
      <div class="msgs" id="msgs"></div>
      <div class="quick" id="quick"></div>
      <div class="composer">
        <input id="input" placeholder="输入群消息，或点击下方快捷演示…" onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">发送</button>
      </div>
    </div>
  </section>
  <!-- 中：Agent 思考 + 任务 -->
  <section class="panel">
    <div class="hd">🧠 Agent 决策流</div>
    <div class="bd" id="feed"></div>
    <div class="hd" style="border-top:1px solid var(--line)">🗂️ 待确认任务（Human-in-the-loop）</div>
    <div class="bd" id="tasks" style="max-height:45%"></div>
  </section>
  <!-- 右：日历 -->
  <section class="panel">
    <div class="hd">📅 我的日历（Tool Calling 写入）</div>
    <div class="bd" id="events"></div>
    <a class="dl" href="/api/calendar.ics" download>⬇️ 下载 calendar.ics（可导入手机/系统日历）</a>
  </section>
</main>

<script>
const state={groups:[],cur:0,chats:{},quickMsgs:{}};
const AV={};
const COLORS=['#3b7cff','#12b76a','#f79009','#7a5af8','#f04438','#06aed4'];

const DEMO={
  '数据结构课程群':[
    '【助教】各位同学，数据结构期末考试定在6月10日 14:00，地点在紫金港校区东1楼101教室，请相互转告',
    '同学们晚上记得来上课，别迟到啦',
    '【助教】重要通知：数据结构期末考试时间变更为6月12日 14:00，地点不变，请以新时间为准'
  ],
  '机器人社社团群':[
    '【社长】机器人社本学期总结会将于6月11日 14:00在南校区活动中心201举行，全体成员参加',
    '【社长】周五晚上社团聚餐，自愿报名，想去的朋友接龙',
    '【社长】通知：总结会改到下周四下午3点，地点不变，收到请扣1',
    '【社长】重要提醒（转自教务）：数据结构期末考试时间为6月11日 9:00，与此前课程群说的6月10日 14:00不一致，请同学们以教务答复为准'
  ],
  '宿舍群':[
    '兄弟们今晚开黑吗？',
    '【同学】提醒一下，数据结构期末考试6月10日 14:00在东1楼101，大家考试周别忘了复习',
    '明天一起去图书馆占座，谁起得早谁去'
  ]
};

async function api(path,opt){const r=await fetch(path,opt);return r.json()}
async function refresh(){
  const s=await api('/api/state');
  state.groups=s.groups;
  document.getElementById('backendTag').textContent='LLM 后端：'+s.llm_backend;
  // tabs
  const tabs=document.getElementById('tabs');
  if(!tabs.children.length){
    tabs.innerHTML=s.groups.map((g,i)=>`<div class="gt${i===state.cur?' on':''}" onclick="switchGroup(${i})">${g}</div>`).join('');
  }
  // rebuild chats from notices+feed? keep client-side msgs
  // feed
  document.getElementById('feed').innerHTML=s.feed.map(f=>
    `<div class="feed-item ${f.phase}"><span class="ph ${f.phase}">${phName(f.phase)}</span>
     <div class="t">${f.ts} · ${esc(f.title)}</div><div class="d">${esc(f.detail)}</div></div>`).join('');
  // tasks
  document.getElementById('tasks').innerHTML=s.tasks.length?s.tasks.map(t=>`
    <div class="task risk-${t.risk} ${t.action!=='pending'?'done':''}">
      <div class="tt">${esc(t.title)}</div><div class="ts">${esc(t.summary)}</div>
      ${(t.detail&&t.detail.raw_messages&&t.detail.raw_messages.length)?`
        <div class="raws"><div class="rh">📋 消息原文（已汇总 ${t.detail.raw_messages.length} 条，确认后写入日历）</div>
        ${t.detail.raw_messages.map(m=>`<div class="raw"><span class="rg">[${esc(m.group)}·${esc(m.sender)}]</span>${esc(m.text)}</div>`).join('')}</div>`:''}
      <div class="meta"><span class="pill ${t.type}">${typeName(t.type)}</span><span class="pill risk">风险：${t.risk==='high'?'高':t.risk==='medium'?'中':'低'}</span></div>
      ${t.action==='pending'?`
        <div class="acts"><button class="ok" onclick="confirm('${t.id}',true)">✓ 确认执行</button>
        <button class="no" onclick="confirm('${t.id}',false)">✗ 忽略</button></div>`
        :`<div class="res ${t.action==='dismissed'?'rej':''}">${t.action==='confirmed'?'✅ '+esc(t.result):'🚫 '+esc(t.result)}</div>`}
      <div class="tool-pre">TOOL_CALL ${esc(JSON.stringify({name:t.tool_call.name,arguments:t.tool_call.arguments},null,0))}</div>
    </div>`).join(''):'<div class="empty">暂无任务<br>Agent 识别到通知后会生成确认卡片</div>';
  // events
  document.getElementById('events').innerHTML=s.events.length?s.events.map(e=>
    `<div class="ev"><div class="dot"></div><div><div class="et">${esc(e.title)}</div>
     <div class="es">${esc(e.start)}${e.location?' · '+esc(e.location):''}</div></div></div>`).join('')
    :'<div class="empty">日历为空<br>确认任务后 Agent 会通过 Tool Calling 写入日程</div>';
}
function phName(p){return{listen:'监听',extract:'识别',decide:'决策',tool:'执行',human:'人工确认',dedup:'去重',skip:'过滤',system:'系统'}[p]||p}
function typeName(t){return{add:'新增日程',update:'时间变更',conflict:'跨群冲突',remind:'提醒'}[t]||t}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function switchGroup(i){state.cur=i;document.querySelectorAll('.gt').forEach((el,j)=>el.classList.toggle('on',j===i));renderMsgs();renderQuick()}
function renderMsgs(){
  const g=state.groups[state.cur]||'';
  const list=state.chats[g]||[];
  document.getElementById('msgs').innerHTML=list.map(m=>`
    <div class="msg ${m.agent?'agent':''}">
      <div class="avatar" style="background:${m.color}">${esc(m.sender[0])}</div>
      <div class="body"><div class="name">${esc(m.sender)}</div><div class="bubble">${esc(m.text)}</div></div>
    </div>`).join('')||'<div class="empty">点击下方快捷按钮，快速演示完整链路</div>';
  document.getElementById('msgs').scrollTop=1e9;
}
function renderQuick(){
  const g=state.groups[state.cur]||'';
  document.getElementById('quick').innerHTML=(DEMO[g]||[]).map((t,i)=>
    `<button onclick="quick(${i})">演示${i+1}：${t.slice(0,14)}…</button>`).join('');
}
async function quick(i){document.getElementById('input').value=DEMO[state.groups[state.cur]][i];send()}
async function send(){
  const inp=document.getElementById('input');
  const text=inp.value.trim(); if(!text)return;
  const g=state.groups[state.cur];
  if(!state.chats[g])state.chats[g]=[];
  const sender='我';
  const color=AV[sender]||(AV[sender]=COLORS[Object.keys(AV).length%COLORS.length]);
  state.chats[g].push({sender,text,color});
  inp.value='';renderMsgs();
  const r=await api('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group:g,sender,text})});
  // Agent 回应气泡
  let reply;
  if(!r.recognized)reply='（非通知消息，已过滤，不产生任务）';
  else if(r.dedup)reply=`🔁 检测到跨群重复通知「${r.notice.event}」，已去重，不重复打扰你`;
  else reply=`📋 已识别通知「${r.notice.event}」→ 生成确认卡片，请在右侧确认是否写入日历`;
  state.chats[g].push({sender:'校园虾宝',text:reply,agent:true,color:'#7a5af8'});
  renderMsgs();refresh();
}
async function confirm(id,ok){
  await api(`/api/task/${id}/confirm`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approved:ok})});
  refresh();
}
async function reset(){await api('/api/reset',{method:'POST'});state.chats={};renderMsgs();refresh()}
refresh();
</script>
</body>
</html>
